name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install linting tools
        run: pip install ruff black

      - name: Run ruff check
        run: ruff check .

      - name: Run black --check
        run: black --check .

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_DATABASE: cgcpt_test
          MYSQL_USER: cgcpt
          MYSQL_PASSWORD: test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CGCPT_DB_URL: mysql+pymysql://cgcpt:test_pw@127.0.0.1:3306/cgcpt_test?charset=utf8mb4
      SECRET_KEY: test-secret-key-for-ci
      ADMIN_USER: admin
      ADMIN_PASS: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term-missing -v || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cgcpt-server:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts
        run: |
          docker run -d --name cgcpt-ci-test \
            -e SECRET_KEY=ci-test-secret \
            -e CGCPT_DB_URL=mysql+pymysql://root:fake@db:3306/cgcpt?charset=utf8mb4 \
            -p 5000:5000 \
            cgcpt-server:ci-test
          sleep 10
          docker logs cgcpt-ci-test
          docker inspect --format='{{.State.Status}}' cgcpt-ci-test | grep -E 'running|starting'
          docker stop cgcpt-ci-test || true
          docker rm cgcpt-ci-test || true
