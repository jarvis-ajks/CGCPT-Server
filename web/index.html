<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGCPT - Crystal Structure Platform</title>
    <link rel="preconnect" href="/CGCPT/api" />
    <style>
      #root:empty::after {
        content: '';
        display: block;
        width: 32px;
        height: 32px;
        margin: 25vh auto;
        border: 3px solid #22d3ee;
        border-top-color: transparent;
        border-radius: 50%;
        animation: _cgcpt_spin 0.8s linear infinite;
      }
      @keyframes _cgcpt_spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
